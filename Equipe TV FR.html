<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; background:#000; overflow: hidden; }
  .video-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  .video-container iframe {
    position: absolute;
    /* هذه التعديلات بناءً على الصورة التي أرفقتها */
    top: -330px;    /* رفع الصفحة للأعلى لإخفاء العنوان */
    left: -15px;    /* إزاحة لليسار */
    width: 130%;    /* زيادة العرض لإخفاء القائمة اليمنى */
    height: 1000px;
    border: 0;
  }
</style>
</head>
<body>
  <div class="video-container">
    <iframe src="http://www.freeintertv.com/view/id-354/France-Sport-1-1" scrolling="no"></iframe>
  </div>
</body>
</html>
