
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>YouTube Player Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

.player-container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

iframe {
    width: 100%;
    flex: 1;
    border: none;
    background: #000;
}

.toolbar {
    padding: 12px;
    background: #111;
    text-align: center;
}

.toolbar a {
    color: white;
    text-decoration: none;
    background: #f00;
    padding: 10px 18px;
    border-radius: 6px;
}
</style>
</head>

<body>

<div class="player-container">

    <iframe
        src="https://www.youtube.com/embed/2lJZPT6OljI?autoplay=1&playsinline=1"
        title="YouTube Player"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen>
    </iframe>

    <div class="toolbar">
        <a href="https://www.youtube.com/watch?v=2lJZPT6OljI"
           target="_blank">
           فتح على YouTube
        </a>
    </div>

</div>

</body>
</html>
