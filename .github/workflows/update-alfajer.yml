name: Update Alfajer streams

on:
  workflow_dispatch:
    inputs:
      force:
        description: "إعادة استخراج كل الروابط حتى لو كانت ما زالت صالحة"
        type: boolean
        default: true
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: update-alfajer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install requirements
        run: python -m pip install -r scripts/requirements.txt

      - name: Test HLS resolver
        run: python scripts/test_hls_resolution.py

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Extract stream URLs
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          args=""
          if [ "$FORCE" = "true" ]; then args="--force"; fi
          python scripts/update_streams.py --debug-dir debug $args

      - name: Upload debug info (screenshots / requests of failed channels)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-alfajer
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit changed streams
        env:
          REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streams/*.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "تحديث روابط قنوات الفجر"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$REF" && git push origin "HEAD:$REF"; then exit 0; fi
            sleep 5
          done
          exit 1
