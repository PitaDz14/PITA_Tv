name: Update stream

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-stream
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read current stream URL from source page
        env:
          SOURCE_PAGE_URL: ${{ vars.SOURCE_PAGE_URL }}
        run: |
          python3 <<'PY'
          import base64, datetime, html, json, os, re, urllib.request
          from urllib.parse import urlparse

          source_url = (os.environ.get("SOURCE_PAGE_URL") or "").strip()
          if not source_url:
              raise SystemExit("SOURCE_PAGE_URL not set")

          req = urllib.request.Request(source_url, headers={
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml",
          })
          with urllib.request.urlopen(req, timeout=25) as r:
              raw_html = r.read().decode("utf-8", errors="replace")

          stream_url = None
          m = re.search(r'''(?:var|let|const)\s+encUrl\s*=\s*["']([^"']+)["']''', raw_html, re.I)
          if m:
              encoded = m.group(1).strip() + "=" * (-len(m.group(1).strip()) % 4)
              stream_url = base64.b64decode(encoded).decode("utf-8").strip()

          if not stream_url:
              m = re.search(r'''https://(?:www\.)?ok\.ru/videoembed/[0-9]+(?:\?[^"'<> ]*)?''', raw_html, re.I)
              if m:
                  stream_url = html.unescape(m.group(0))

          if not stream_url:
              raise SystemExit("No supported stream/embed URL found in the source page.")

          parsed = urlparse(stream_url)
          if parsed.scheme not in ("http", "https") or parsed.hostname not in {"ok.ru", "www.ok.ru"}:
              raise SystemExit(f"Unexpected stream host: {parsed.hostname}")

          payload = {
              "url": stream_url,
              "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          with open("stream.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Stream updated from host: {parsed.hostname}")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stream.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "تحديث رابط البث"
          git push
