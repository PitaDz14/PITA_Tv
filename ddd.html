<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HD5 — بث مباشر</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background:#0a0e15; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px; color:#e0e6ed; font-family:Tahoma,Arial,sans-serif; }
    .top { width:100%; max-width:1000px; display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
    .brand { font-weight:800; font-size:19px; display:flex; align-items:center; gap:10px; }
    .dot { width:11px;height:11px;border-radius:50%;background:#d00d0c;box-shadow:0 0 12px #d00d0c; }
    .note { font-size:12px; color:#8b98ab; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:8px 12px; max-width:62%; line-height:1.5; }
    .shell { position:relative; width:100%; max-width:1000px; aspect-ratio:16/9; background:#000; border-radius:14px; overflow:hidden; border:1px solid rgba(255,255,255,.08); box-shadow:0 20px 50px rgba(0,0,0,.5); }
    .frame { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
    .status { position:absolute; bottom:10px; right:12px; font-size:11px; background:rgba(0,0,0,.6); padding:4px 10px; border-radius:8px; color:#8b98ab; z-index:5; }
    .fallback { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#000; text-align:center; padding:20px; }
    .fallback a { display:inline-flex; align-items:center; gap:8px; background:#d00d0c; color:#fff; text-decoration:none; font-weight:700; padding:12px 22px; border-radius:10px; }
    .ctrl { margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
    .ctrl a, .ctrl button { display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#e0e6ed; font-size:14px; font-weight:600; padding:11px 20px; border-radius:10px; cursor:pointer; text-decoration:none; transition:.2s; }
    .ctrl a:hover, .ctrl button:hover { background:rgba(255,255,255,.1); border-color:#d00d0c; transform:translateY(-2px); }
    footer { margin-top:16px; font-size:12px; color:#8b98ab; }
</style>
</head>
<body>
    <div class="top">
        <div class="brand"><span class="dot"></span> HD5 · بث مباشر</div>
        <div class="note">تُعرض الصفحة وكأنها الموقع الرسمي — يعمل عندما تكون داخل نطاق <b>m.newsok.online</b>.</div>
    </div>

    <div class="shell" id="shell">
        <div class="status" id="status">جارٍ التجهيز…</div>
        <div class="fallback" id="fallback">
            <div>لم يُعثر على عنصر المشغّل داخل الإطار</div>
            <a href="https://m.newsok.online/2026/01/hd5.html" target="_blank" rel="noopener">فتح مباشرة ↗</a>
        </div>
        <iframe class="frame" id="frame" title="HD5 Live" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen; web-share" allowfullscreen></iframe>
    </div>

    <div class="ctrl">
        <a href="https://m.newsok.online/2026/01/hd5.html" target="_blank" rel="noopener">فتح في نافذة جديدة ↗</a>
        <button type="button" id="reload">⟳ إعادة تحميل</button>
    </div>

    <footer>جميع البثوث مقدمة من أطراف ثالثة · لا نحتفظ بأي محتوى</footer>

    <script>
        const TARGET = "https://m.newsok.online/2026/01/hd5.html";
        const frame  = document.getElementById("frame");
        const status = document.getElementById("status");
        const fallback = document.getElementById("fallback");

        // ── الخدعة: نتسلل لكود المصدر قبل أن يفحص نفسه ──
        frame.addEventListener("load", () => {
            let ok = false;
            try {
                const w = frame.contentWindow;
                // نخدعه بأن frameElement غير موجودة ⇒ "أنا لست داخل iframe"
                // نستخدم PropertyDescriptor عشان نخليها ثابتة لا يتوقعها الكود
                Object.defineProperty(w, "frameElement", {
                    configurable: true,
                    enumerable: false,
                    get: () => null
                });
                // فحص إضافي في الكود: window.parent !== window
                // نجعل parent يعود لنفسه تماماً كأنه أعلى مستوى
                try {
                    Object.defineProperty(w, "parent", { configurable: true, get: () => w });
                    Object.defineProperty(w, "top",    { configurable: true, get: () => w });
                } catch (_) {}
                ok = true;
            } catch (err) {
                ok = false;
            }

            if (ok) {
                status.textContent = "✅ متصل (توهم رسمي)";
                status.style.color = "#4ade80";
                fallback.style.display = "none";
            } else {
                status.textContent = "⚠️ نطاق مختلف — استخدم زر «فتح مباشرة»";
                status.style.color = "#fbbf24";
                fallback.style.display = "flex";
            }
        }, { once: false });

        // بدء التحميل
        frame.src = TARGET;

        // إعادة تحميل (تحديث التوقيت لتخطي الكاش)
        document.getElementById("reload").addEventListener("click", () => {
            status.textContent = "جارٍ التجهيز…";
            status.style.color = "#8b98ab";
            fallback.style.display = "none";
            frame.src = TARGET + (TARGET.includes("?") ? "&" : "?") + "t=" + Date.now();
        });

        // مراقبة: هل تم إيجاد عنصر المشغل داخل الصفحة الأصلية؟
        setInterval(() => {
            try {
                const doc = frame.contentDocument;
                if (doc && doc.getElementById("hd5")) {
                    status.textContent = "✅ يعمل — المشغّل نشط";
                    status.style.color = "#4ade80";
                }
            } catch (_) {}
        }, 3000);
    </script>
</body>
</html>
