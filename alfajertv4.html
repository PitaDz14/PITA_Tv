<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Alfajer TV 4</title>
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#000; }
    #video, #fallback { position:fixed; inset:0; width:100%; height:100%; border:0; background:#000; }
    #video { object-fit:contain; }
    #status { position:fixed; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; text-align:center;
      padding:20px; color:#fff; background:#000; font-family:Arial,sans-serif; font-size:15px; }
    [hidden] { display:none !important; }
    #note { position:fixed; bottom:8px; inset-inline:8px; z-index:3; font:12px/1.5 Arial,sans-serif; color:#ddd; background:#000c;
      padding:6px 10px; border-radius:8px; text-align:center; direction:ltr; word-break:break-all; }
  </style>
</head>
<body>
  <div id="status">جاري تحميل البث…</div>
  <video id="video" controls playsinline webkit-playsinline autoplay muted></video>
  <div id="note" hidden></div>
  <iframe id="fallback" hidden allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>

  <script src="vendor/hls.min.js"></script>
  <script>
  (function () {
    "use strict";

    // معرّف هذه القناة (يطابق streams/<id>.json و config/channels.json)
    var CHANNEL_ID = "alfajertv4";
    var REFRESH_MS = 60 * 1000;      // فحص الرابط الجديد كل دقيقة بدون إعادة تحميل الصفحة

    var video = document.getElementById("video");
    var statusBox = document.getElementById("status");
    var fallback = document.getElementById("fallback");

    var hls = null, currentUrl = "", info = null, failures = 0, curExpiry = 0, lastErr = "";
    var note = document.getElementById("note");
    var SWITCH_BEFORE_MS = 4 * 60 * 1000;   // التبديل الاستباقي قبل انتهاء الـ token بـ 4 دقائق

    function say(text) { statusBox.textContent = text; statusBox.hidden = !text; }

    function fetchInfo() {
      return fetch("streams/" + CHANNEL_ID + ".json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
    }

    function validUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u); }

    // الصفحة https لا تحمّل http (Mixed Content) → نجرّب النسخة https من نفس الرابط
    function adapt(u) {
      return (location.protocol === "https:" && /^http:\/\//i.test(u)) ? u.replace(/^http:/i, "https:") : u;
    }

    function stop() {
      if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    }

    function showFallback(reason) {
      stop();
      var src = info && validUrl(info.source_url) ? info.source_url : "";
      if (!src) { say(reason || "تعذر تشغيل القناة حاليًا."); return; }
      video.hidden = true; fallback.hidden = false;
      note.hidden = false;
      note.textContent = "Fallback: " + (reason || "") + (lastErr ? " | " + lastErr : "");
      if (fallback.getAttribute("src") !== src) fallback.src = src;
      say("");
    }

    function isHealthy() {
      return !!hls && !video.hidden && !video.paused && !video.ended && video.readyState >= 3;
    }

    function play(url, expiresAt) {
      stop();
      currentUrl = url;
      curExpiry = expiresAt ? Date.parse(expiresAt) || 0 : 0;
      fallback.hidden = true; fallback.removeAttribute("src"); video.hidden = false; note.hidden = true;
      say("جاري تحميل البث…");
      var u = adapt(url);

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ manifestLoadingMaxRetry: 1, levelLoadingMaxRetry: 2, fragLoadingMaxRetry: 3 });
        var h = hls, mediaTries = 0;
        h.on(Hls.Events.MANIFEST_PARSED, function () {
          var p = video.play(); if (p && p.catch) p.catch(function () {});
        });
        h.on(Hls.Events.FRAG_LOADED, function () { failures = 0; say(""); });
        h.on(Hls.Events.ERROR, function (_e, d) {
          if (!d || !d.fatal || h !== hls) return;
          if (d.type === Hls.ErrorTypes.MEDIA_ERROR && mediaTries++ < 2) { h.recoverMediaError(); return; }
          // خطأ شبكة غالبًا بسبب انتهاء الـ token → اجلب الرابط الجديد فورًا
          lastErr = d.type + " / " + d.details + (d.response && d.response.code ? " / HTTP " + d.response.code : "");
          console.warn("HLS fatal:", lastErr, adapt(currentUrl).replace(/\?.*/, "?…"));
          failures++;
          refresh(true);
        });
        h.loadSource(u);
        h.attachMedia(video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = u;                         // Safari / iOS
        video.onloadedmetadata = function () { var p = video.play(); if (p && p.catch) p.catch(function () {}); say(""); };
        video.onerror = function () { failures++; refresh(true); };
      } else {
        showFallback("المتصفح لا يدعم HLS.");
      }
    }

    // يقرأ الرابط الحالي من JSON؛ إذا تغيّر الـ token يبدّل المصدر تلقائيًا
    function refresh(force) {
      return fetchInfo().then(function (d) {
        info = d;
        if (!validUrl(d.stream_url)) { if (!currentUrl) showFallback("لا يوجد رابط بث محدّث بعد."); return; }
        if (d.stream_url !== currentUrl) {
          // رابط جديد (token جديد). لا نقطع بثًا سليمًا إلا قبيل انتهاء الـ token الحالي أو عند وجود خطأ.
          var nearExpiry = curExpiry && (curExpiry - Date.now()) < SWITCH_BEFORE_MS;
          if (force || !isHealthy() || nearExpiry || !curExpiry) {
            failures = 0;
            play(d.stream_url, d.expires_at);
          }
        } else if (force) {
          if (failures >= 3) showFallback("تعذر تشغيل البث.");
          else play(d.stream_url, d.expires_at);   // نفس الرابط: أعد المحاولة
        } else if (!fallback.hidden) {
          play(d.stream_url, d.expires_at);        // كنا في الوضع الاحتياطي: جرّب البث الأصلي مجددًا
        }
      }).catch(function (err) {
        console.error("Unable to load stream info:", err);
        if (!currentUrl) say("تعذر تحميل رابط البث حاليًا.");
      });
    }

    refresh(false);
    setInterval(function () { refresh(false); }, REFRESH_MS);
  })();
  </script>
</body>
</html>
