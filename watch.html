<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>مشغّل القنوات</title>
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#000; }
    #video, #fallback { position:fixed; inset:0; width:100%; height:100%; border:0; background:#000; }
    #video { object-fit:contain; }
    #status { position:fixed; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; text-align:center;
      padding:20px; color:#fff; background:rgba(0,0,0,.82); font-family:Arial,sans-serif; font-size:15px; }
    [hidden] { display:none !important; }
    #note { position:fixed; bottom:8px; inset-inline:8px; z-index:3; font:12px/1.5 Arial,sans-serif; color:#ddd; background:#000c;
      padding:6px 10px; border-radius:8px; text-align:center; direction:ltr; word-break:break-all; }
  </style>
</head>
<body>
  <div id="status">جاري تحميل البث…</div>
  <video id="video" controls playsinline webkit-playsinline autoplay muted></video>
  <div id="note" hidden></div>
  <iframe id="fallback" hidden allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>

  <script src="vendor/hls.min.js"></script>
  <!-- خريطة مولَّدة آليًا: تعرف صفحة كل قناة الاحتياطية بلا fetch (تعمل على file://) -->
  <script src="sports.js"></script>
  <script>
  (function () {
    "use strict";

    // صفحة مشغل عامة لكل قنوات الموقع (Sport والفجر معًا): تقرأ المعرّف من
    // الرابط (?id=sportN أو ?id=alfajertvN) فتخدم أي عدد من القنوات دون ملف
    // جديد لكل قناة. العنوان يُضبط من حقل "channel" في streams/<id>.json.
    var params = new URLSearchParams(location.search);
    var CHANNEL_ID = (params.get("id") || "sport1").trim();
    if (!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(CHANNEL_ID)) CHANNEL_ID = "sport1";

    // سياسة العرض: صفحة المصدر لا تُعرض للمشاهد إلا لقنوات الفجر. قنوات Sport (ألوان)
    // لا يُوجَّه مشاهدها إلى موقع المصدر أبدًا (إعلانات مزعجة): تنبيه بسيط فقط، ويُعرض البث تلقائيًا عند توفّره.
    var PAGE_FALLBACK_ALLOWED = /^alfajertv\d*$/.test(CHANNEL_ID);
    var NO_STREAM_MSG = "لم يتم استخراج رابط البث لهذه القناة حاليًا. عند توفّر بث سيتم عرضه تلقائيًا.";

    var REFRESH_MS = 60 * 1000;      // فحص الرابط الجديد كل دقيقة بدون إعادة تحميل الصفحة

    var video = document.getElementById("video");
    var statusBox = document.getElementById("status");
    var fallback = document.getElementById("fallback");

    var hls = null, currentUrl = "", info = null, failures = 0, curExpiry = 0, lastErr = "";
    var note = document.getElementById("note");
    var SWITCH_BEFORE_MS = 4 * 60 * 1000;   // التبديل الاستباقي قبل انتهاء الـ token بـ 4 دقائق

    function say(text) { statusBox.textContent = text; statusBox.hidden = !text; }

    function fetchInfo() {
      return fetch("streams/" + CHANNEL_ID + ".json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
    }

    function validUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u); }

    // صفحة القناة الاحتياطية من الخريطة المولَّدة (sports.js) — متاحة فورًا
    // بلا شبكة، فتبقى معروفة حتى لو فشل جلب streams/<id>.json بالكامل.
    function knownPage() {
      var m = window.SPORTS;
      var u = m && typeof m === "object" ? m[CHANNEL_ID] : "";
      return validUrl(u) ? u : "";
    }

    // الصفحة https لا تحمّل http (Mixed Content) → نجرّب النسخة https من نفس الرابط
    function adapt(u) {
      return (location.protocol === "https:" && /^http:\/\//i.test(u)) ? u.replace(/^http:/i, "https:") : u;
    }

    function stop() {
      if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    }

    // الحل الثانوي: نعرض صفحة القناة داخل إطار، مع رابط مباشر أسفل الصفحة
    // (بعض المواقع تمنع العرض داخل إطار، فيبقى الرابط صالحًا للفتح مباشرة).
    function showFallback(reason) {
      stop();
      // الصفحة تُعرض فقط للقنوات التي لها fallback_url صريح (قنوات الفجر)؛ غيرها رسالة فقط.
      var src = PAGE_FALLBACK_ALLOWED ? ((info && validUrl(info.source_url)) ? info.source_url : knownPage()) : "";
      if (!src) {
        video.hidden = true; fallback.hidden = true; fallback.removeAttribute("src"); note.hidden = true;
        say(NO_STREAM_MSG);
        return;
      }
      video.hidden = true; fallback.hidden = false;
      note.hidden = false;
      note.innerHTML = "";
      note.appendChild(document.createTextNode((reason ? reason + " — " : "") + "افتح الصفحة: "));
      var a = document.createElement("a");
      a.href = src; a.target = "_blank"; a.rel = "noopener";
      a.style.color = "#8ecbff"; a.style.wordBreak = "break-all";
      a.textContent = src;
      note.appendChild(a);
      if (fallback.getAttribute("src") !== src) fallback.src = src;
      say("");
    }

    function isHealthy() {
      return !!hls && !video.hidden && !video.paused && !video.ended && video.readyState >= 3;
    }

    function play(url, expiresAt) {
      stop();
      currentUrl = url;
      curExpiry = expiresAt ? Date.parse(expiresAt) || 0 : 0;
      fallback.hidden = true; fallback.removeAttribute("src"); video.hidden = false; note.hidden = true;
      say("جاري تحميل البث…");
      var u = adapt(url);

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ manifestLoadingMaxRetry: 1, levelLoadingMaxRetry: 2, fragLoadingMaxRetry: 3 });
        var h = hls, mediaTries = 0;
        h.on(Hls.Events.MANIFEST_PARSED, function () {
          var p = video.play(); if (p && p.catch) p.catch(function () {});
        });
        h.on(Hls.Events.FRAG_LOADED, function () { failures = 0; say(""); });
        // أخطاء تعذّر فيها إنشاء مخزن الترميز: المتصفح لا يدعم ترميز البث أصلًا
        // (مثل Chromium المبني بلا ترميزات احترافية). إعادة المحاولة عبثية.
        var CODEC_DEAD = { bufferIncompatibleCodecsError: 1, bufferAddCodecError: 1 };
        h.on(Hls.Events.ERROR, function (_e, d) {
          if (!d || !d.fatal || h !== hls) return;
          lastErr = d.type + " / " + d.details + (d.response && d.response.code ? " / HTTP " + d.response.code : "");
          if (CODEC_DEAD[d.details]) {
            console.warn("HLS codec unsupported:", lastErr);
            showFallback("المتصفح لا يدعم ترميز هذا البث");
            return;
          }
          if (d.type === Hls.ErrorTypes.MEDIA_ERROR && mediaTries++ < 2) { h.recoverMediaError(); return; }
          // خطأ شبكة غالبًا بسبب انتهاء الـ token → اجلب الرابط الجديد فورًا
          console.warn("HLS fatal:", lastErr, adapt(currentUrl).replace(/\?.*/, "?…"));
          failures++;
          refresh(true);
        });
        h.loadSource(u);
        h.attachMedia(video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = u;                         // Safari / iOS
        video.onloadedmetadata = function () { var p = video.play(); if (p && p.catch) p.catch(function () {}); say(""); };
        video.onerror = function () { failures++; refresh(true); };
      } else {
        showFallback("المتصفح لا يدعم HLS.");
      }
    }

    // يقرأ الرابط الحالي من JSON؛ إذا تغيّر الـ token يبدّل المصدر تلقائيًا
    function refresh(force) {
      return fetchInfo().then(function (d) {
        info = d;
        if (d.channel) document.title = d.channel;
        // لا يوجد رابط بث صالح (فشل الاستخراج / مصدر معطّل / بلا مصدر):
        // نعرض صفحة القناة كحل ثانوي إن توفّرت، وإلا رسالة واضحة.
        if (d.status === "fallback" || d.status === "offline" ||
            d.status === "unconfigured" || !validUrl(d.stream_url)) {
          if (PAGE_FALLBACK_ALLOWED && validUrl(d.source_url)) {
            showFallback(d.status === "unconfigured" ? "لا يوجد مصدر بث بعد" : "تعذّر استخراج رابط البث");
          } else {
            showFallback("");   // قنوات Sport: تنبيه فقط بلا أي رابط
          }
          return;
        }
        if (d.stream_url !== currentUrl) {
          // رابط جديد (token جديد). لا نقطع بثًا سليمًا إلا قبيل انتهاء الـ token الحالي أو عند وجود خطأ.
          var nearExpiry = curExpiry && (curExpiry - Date.now()) < SWITCH_BEFORE_MS;
          if (force || !isHealthy() || nearExpiry || !curExpiry) {
            failures = 0;
            play(d.stream_url, d.expires_at);
          }
        } else if (force) {
          if (failures >= 3) showFallback("تعذر تشغيل البث.");
          else play(d.stream_url, d.expires_at);   // نفس الرابط: أعد المحاولة
        } else if (!fallback.hidden) {
          play(d.stream_url, d.expires_at);        // كنا في الوضع الاحتياطي: جرّب البث الأصلي مجددًا
        }
      }).catch(function (err) {
        console.error("Unable to load stream info:", err);
        if (currentUrl) return;              // هناك بث يعمل: لا نقطعه بسبب فشل تحديث الملف
        // تعذّر قراءة ملف القناة (ملف غير منشور، file://، خطأ شبكة): نعرض صفحة
        // القناة الاحتياطية من الخريطة المحلية بدل رسالة مسدودة.
        if (knownPage()) { showFallback("تعذر تحميل بيانات القناة"); return; }
        say("تعذر تحميل رابط البث حاليًا.");
      });
    }

    refresh(false);
    setInterval(function () { refresh(false); }, REFRESH_MS);
  })();
  </script>
</body>
</html>
