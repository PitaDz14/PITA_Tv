<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Live Player</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #000;
      font-family: Arial, sans-serif;
      font-size: 15px;
      z-index: 2;
    }

    #status[hidden] {
      display: none;
    }
  </style>
<script defer src="/__resilience/register.js"></script></head>
<body>
  <div id="status">جاري تحميل البث…</div>

  <iframe
    id="player"
    src="about:blank"
    referrerpolicy="no-referrer"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen>
  </iframe>

  <script>
    const iframe = document.getElementById("player");
    const statusBox = document.getElementById("status");

    let currentUrl = "";

    async function refreshStream() {
      try {
        const response = await fetch("./stream.json?t=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!data.url || !/^https?:\/\//i.test(data.url)) {
          throw new Error("Invalid stream URL");
        }

        if (data.url !== currentUrl) {
          currentUrl = data.url;
          iframe.src = currentUrl;
        }

        statusBox.hidden = true;
      } catch (error) {
        console.error("Unable to load stream:", error);

        if (!currentUrl) {
          statusBox.textContent = "تعذر تحميل رابط البث حالياً.";
          statusBox.hidden = false;
        }
      }
    }

    iframe.addEventListener("load", () => {
      if (currentUrl) statusBox.hidden = true;
    });

    refreshStream();

    // يفحص stream.json كل دقيقة بدون إعادة تحميل الصفحة.
    setInterval(refreshStream, 60 * 1000);
  </script>
</body>
</html>
