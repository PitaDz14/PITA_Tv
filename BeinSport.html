<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>beIN Sports</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }
    #player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    #player iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #000;
    }
    #message {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-size: 1.1rem;
      line-height: 1.8;
      background: #000;
    }
    #message.show { display: flex; }
  </style>
</head>
<body>
  <main id="player"></main>
  <div id="message" role="alert"></div>

  <script>
    (function () {
      "use strict";

      // لإضافة قناة جديدة: أضف سطراً جديداً هنا بالشكل  المعرّف: { name, url }
      var CHANNELS = {
        bein_sport_News: {
          name: "BeIN Sports News",
          url: "https://channel.aflam4you.net/embed.php?vid=31"
        },
        bein_sport_1: {
          name: "BeIN Sports 1",
          url: "https://channel.aflam4you.net/playeraf.php?vid=68"
        },
        bein_sport_2: {
          name: "BeIN Sports 2",
          url: "https://channel.aflam4you.net/zzremb472.php?vid=2"
        },
        bein_sport_3: {
          name: "BeIN Sports 3",
          url: "https://channel.aflam4you.net/zzremb472.php?vid=1"
        },
        bein_sport_4: {
          name: "BeIN Sports 4",
          url: "https://channel.aflam4you.net/zzremb472.php?vid=3"
        }
      };

      var playerEl = document.getElementById("player");
      var messageEl = document.getElementById("message");

      function showMessage(text) {
        playerEl.innerHTML = "";
        messageEl.textContent = text;
        messageEl.classList.add("show");
      }

      function loadChannel(channel) {
        var iframe = document.createElement("iframe");
        iframe.src = channel.url;
        iframe.title = channel.name + " - مشغل القناة";
        iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
        iframe.allowFullscreen = true;
        iframe.referrerPolicy = "no-referrer-when-downgrade";
        iframe.setAttribute("allowfullscreen", "");
        playerEl.appendChild(iframe);
        document.title = channel.name;
      }

      var id = new URLSearchParams(window.location.search).get("id");
      id = id ? id.trim() : "";

      if (!id) {
        showMessage("لم يتم تحديد القناة. أضف المعامل id إلى الرابط، مثال: BeinSport.html?id=bein_sport_1");
      } else if (Object.prototype.hasOwnProperty.call(CHANNELS, id)) {
        loadChannel(CHANNELS[id]);
      } else {
        showMessage("القناة غير معروفة: " + id);
      }
    })();
  </script>
</body>
</html>
